name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        # pip picks the newest scikit-learn each Python supports for the
        # unpinned entry; 1.5.2 is the first 1.5.x release with Python 3.13 wheels.
        scikit-learn: ["scikit-learn>=1.5,<1.6", "scikit-learn"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' '${{ matrix.scikit-learn }}'
      - run: python -m pytest -q
      - run: python -m mypy featranker tests/typing/consumer.py

  # Installs the built wheel in a fresh virtualenv outside the checkout, so a
  # missing package-data file or console script cannot hide behind `pip install -e`.
  # Oldest supported scikit-learn on the oldest Python, newest on the newest.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", scikit-learn: "scikit-learn>=1.5,<1.6", extras: ""}
          - {python: "3.10", scikit-learn: "scikit-learn>=1.5,<1.6", extras: "[all,shap,plot]"}
          - {python: "3.13", scikit-learn: "scikit-learn", extras: ""}
          - {python: "3.13", scikit-learn: "scikit-learn", extras: "[all,shap,plot]"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Smoke-test the installed wheel
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          # sed, not tomllib: the oldest matrix Python (3.10) has no tomllib
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test -n "$version"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls "$PWD"/dist/*.whl)${EXTRAS}" '${{ matrix.scikit-learn }}'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/smoke_installed.py" --expect-version "$version" ${EXTRAS:+--extras}
