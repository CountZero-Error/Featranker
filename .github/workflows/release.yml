name: release

# Publishes to PyPI when a version tag (v1.2.3) is pushed, using PyPI trusted
# publishing: no API token is stored. One-time setup on pypi.org is in
# docs/api.md ("Releasing"). Actions are pinned to commit SHAs (tag in the comment).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' twine
      - run: python -m pytest -q
      - run: python -m mypy featranker tests/typing/consumer.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel in a fresh virtualenv outside the checkout
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python -m venv "$RUNNER_TEMP/smoke"
          wheel=$(ls "$PWD"/dist/*.whl)
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/tests/smoke_installed.py" --expect-version "$version"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install "${wheel}[all,shap,plot]"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/tests/smoke_installed.py" --expect-version "$version" --extras
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/featranker/
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
