[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featranker"
version = "1.9.0"
description = "Rank feature importance across multiple ML models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "CountZero" }]
keywords = [
  "feature importance", "feature selection", "permutation importance",
  "scikit-learn", "machine learning", "model-agnostic",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy",
  "scikit-learn",
  "pyyaml",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/CountZero-Error/Featranker"
Documentation = "https://github.com/CountZero-Error/Featranker/tree/main/docs"
Releases = "https://github.com/CountZero-Error/Featranker/releases"
Issues = "https://github.com/CountZero-Error/Featranker/issues"

[project.optional-dependencies]
xgboost = ["xgboost"]
catboost = ["catboost"]
all = ["xgboost", "catboost"]
plot = ["matplotlib"]
shap = ["shap"]
test = ["pytest>=8.2", "pandas", "matplotlib", "shap", "build", "mypy", "types-PyYAML"]

[project.scripts]
featranker = "featranker.cli:main"

[tool.setuptools]
packages = ["featranker"]
include-package-data = true

[tool.setuptools.package-data]
featranker = ["importance_config.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# These ship no type information.
module = ["sklearn.*", "joblib.*", "tqdm.*", "pandas.*", "matplotlib.*", "xgboost.*", "catboost.*", "shap.*", "scipy.*"]
ignore_missing_imports = true
