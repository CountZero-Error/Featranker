schema: spec-driven

context: |
  FeatRanker: Python >=3.10 library + CLI (PyPI "featranker") for leakage-safe,
  model-agnostic feature ranking. Fits many scikit-learn-compatible estimators on
  training data, measures (grouped) permutation importance on a separate
  evaluation set, ranks groups per model, and builds a median-rank consensus
  gated on a dummy baseline. Reports are strict-JSON dicts.

  Code: featranker/importance.py (FeatureRanker), featranker/cli.py,
  featranker/importance_config.yaml (built-in model registry). Tests: pytest in
  tests/. Docs: README.md + docs/ (usage, report, models). Deps: numpy,
  scikit-learn, pyyaml, tqdm; optional xgboost/lightgbm/catboost.

  Principles: trustworthy over clever; every claim in docs verified against code;
  no network calls or API keys in the core package; keep the API small; the
  report dict shape is public API (additive changes only before 1.0).
  Conventional commits. Maintainer reviews and commits; releases are tagged
  vX.Y.Z with a GitHub release; maintainer uploads to PyPI.

  Roadmap to 1.0 (thesis: which features matter, how sure, and a leakage-safe
  way to use the answer):
    0.5  family-aware consensus, verbose flag, deterministic report summary
    0.6  stability: resampled ranking across splits
    0.7  significance: shadow features
    0.8  ConsensusSelector (scikit-learn SelectorMixin, nested-CV safe)
    0.9  LLM interpretation: to_prompt() + explain(report, llm=callable),
         provider-neutral, no SDK dependency
    1.0  report object + plots, py.typed, trusted publishing, API freeze
  After 1.0 (spike-investigator-value: NO-GO LLM, see spikes/investigator/FINDINGS.md):
    1.1  evidence-for-why: SHAP extra (TreeExplainer/LinearExplainer),
         group correlation, train-vs-eval score; no LLM use;
         explain()/to_prompt() deprecated (removed in 2.0)
    --   llm-investigator: not built (was planned as 1.2; spike NO-GO)
  Done after 1.1 (weaknesses review, 2026-10-19/20):
    1.2  fast-preset: group="fast", one model per family (dummy-loser skip
         dropped: schema edge cases for little saving)
    1.3  auto-groups: auto_groups() and feature_groups="auto" (selector, CLI)
    1.4  shadow-test: binomial hits test over resampled splits, BH q-values,
         ConsensusSelector(max_shadow_q=)
    docs benchmark vs Boruta / sklearn / feature-engine (docs/benchmark.md)
  Known limitations (found 2026-10-19/20 in reviews and the benchmark;
  not scheduled; maintainer decides):
    Method and statistics
    L1  interaction blind spot: above_shadow_share averages families, so
        effects only some families can model fail the 0.5 rule
        (classification c*d recall 0.44-0.64; group="tree" 0.92-1.00)
    L2  shadow block uses one shared row order: collinear real pairs stay
        collinear in the shadows and inflate shadow_max for linear models
        (observed on one seed)
    L3  shadow hits test is approximate (overlapping splits), its 0.5 null
        is conservative, and at cv=5 only 5/5 reaches p=0.031; in the
        benchmark max_shadow_q never beat min_shadow_share
    L4  correlated features still split permutation importance unless
        grouped; auto_groups threshold is fixed at 0.7 in the selector and
        CLI; small samples inflate |rho|
    L5  SHAP only for linear and tree models (no model-agnostic fallback);
        mean |SHAP| not comparable across models; linear direction is
        always +/-1; shap < 0.52 untested
    L6  group="all" showed no consistent gain over "fast" in the benchmark;
        a one-model family vote is less robust than a family median
    Data coverage
    L7  missing values rejected, even for models that handle NaN natively
        (HistGradientBoosting, XGBoost, CatBoost)
    L8  numeric input only: no categorical or string columns; estimators
        receive float arrays without column names
    L9  no sample weights
    L10 tabular data and scikit-learn-style estimators only
    Performance
    L11 slower than single-model selectors (benchmark means 3-19 s vs
        0.3-5 s); SVR in "fast" is quadratic in rows; models that lose to
        the dummy are still permuted
    L12 correlation evidence and auto_groups are O(columns^2)
    Traceability
    L13 the report does not record the model group/preset or the
        auto_groups threshold and method used
    L14 rankers with evidence=True pickle their training data (about 2x
        with shadows)
    API and deprecation
    L15 explain()/to_prompt() deprecated, removal in 2.0; the prompt rules
        do not describe the hits test (only the shadow_test block is shown)
    Engineering
    L16 small open review items: fast tag is a truthiness check; the scaler
        test covers one model; no CLI test for an unknown --group; odd
        unsupported reason for "passthrough" pipeline steps
    L17 n_jobs tests and mypy with types-PyYAML are verified only in CI,
        not in the local sandbox
    Release
    L18 1.0-1.4 unreleased; local main is ahead of origin; six older
        commits carry Claude-Session lines

rules:
  proposal:
    - Include a Non-goals section
    - State any change to the public report schema explicitly
  design:
    - Prefer the smallest design that works; justify any new dependency
  tasks:
    - Every behavior change has a test task written before the implementation task
    - Include a docs task whenever user-visible behavior changes
